[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unicloud"
version = "0.3.0"
description = "Universal multi-cloud transfer and local-to-cloud management platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alex Guo" }
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0"
]

[project.scripts]
unicloud = "unicloud.cli:main"
unicloud-mcp = "unicloud.mcp_server:main"
gopro2cloud = "unicloud.cli:main_gopro_legacy"
gopro2cloud-mcp = "unicloud.mcp_server:main"
cloudsync = "unicloud.cli:main_cloudsync"
