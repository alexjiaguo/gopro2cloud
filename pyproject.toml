[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gopro2cloud"
version = "0.2.0"
description = "Stream and sync GoPro videos directly to any cloud storage with zero local disk footprint"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alex Guo" }
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0"
]

[project.scripts]
gopro2cloud = "gopro2cloud.cli:main"
gopro2cloud-mcp = "gopro2cloud.mcp_server:main"
cloudsync = "gopro2cloud.cli:main_cloudsync"
